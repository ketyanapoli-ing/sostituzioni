<title>Sostituzioni docenti</title>
<style>:root{
 --bg:#EAF0F8;--surface:#fff;--ink:#0F1B33;--mut:#566786;--line:#D5DFEE;--soft:#F2F6FB;
 --board:#0E3C8C;--board2:#1C54AC;--chalk:#F2F6FF;--chalk2:#B9CBEC;
 --hl:#FFD84D;--hl-ink:#2E2500;--pen:#1F5FE0;--pen-bg:#E1EAFD;
 --ok:#16794C;--okbg:#E1F3EA;--bad:#C23B22;--badbg:#FCE9E5;--warn:#8A5A00;--warnbg:#FFF1CF;
 --t1:#16794C;--t2:#6A3FB5;--t3:#A15C00;--t4:#0E7490;--t0:#566786;
 --sans:"Source Sans 3","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
 --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
 --bg:#0A1325;--surface:#121F38;--ink:#E6EEFB;--mut:#9DB0D0;--line:#22324F;--soft:#17274A;
 --board:#0A2158;--board2:#133576;--chalk:#EEF4FF;--chalk2:#9DB3DA;
 --hl:#FFD84D;--hl-ink:#2E2500;--pen:#8FB4FF;--pen-bg:#18294D;
 --ok:#5BD39B;--okbg:#12301F;--bad:#FF8F7A;--badbg:#3A1C17;--warn:#F2BF5C;--warnbg:#33270E;
 --t1:#5BD39B;--t2:#BD9CF2;--t3:#F2BF5C;--t4:#5ED0E8;--t0:#9DB0D0}}
:root[data-theme=dark]{color-scheme:dark;
 --bg:#0A1325;--surface:#121F38;--ink:#E6EEFB;--mut:#9DB0D0;--line:#22324F;--soft:#17274A;
 --board:#0A2158;--board2:#133576;--chalk:#EEF4FF;--chalk2:#9DB3DA;
 --hl:#FFD84D;--hl-ink:#2E2500;--pen:#8FB4FF;--pen-bg:#18294D;
 --ok:#5BD39B;--okbg:#12301F;--bad:#FF8F7A;--badbg:#3A1C17;--warn:#F2BF5C;--warnbg:#33270E;
 --t1:#5BD39B;--t2:#BD9CF2;--t3:#F2BF5C;--t4:#5ED0E8;--t0:#9DB0D0}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{font:17px/1.45 var(--sans);background:var(--bg);color:var(--ink);padding-bottom:84px;-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* intestazione */
header.top{position:sticky;top:0;z-index:5;background:var(--board);color:var(--chalk);padding:calc(6px + env(safe-area-inset-top)) max(10px,calc((100% - 900px)/2 + 10px)) 4px;display:flex;align-items:center;gap:4px}
.band{background:var(--board);color:var(--chalk);padding:2px max(14px,calc((100% - 900px)/2 + 14px)) 12px;border-radius:0 0 18px 18px;margin-bottom:12px}
.badge{font:600 12px/1 var(--sans);padding:7px 11px;border-radius:99px;background:var(--board2);color:var(--chalk);white-space:nowrap;cursor:pointer;border:0;display:inline-flex;align-items:center;gap:6px}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--chalk2)}
.badge.ok::before{background:#5BD39B}.badge.warn::before{background:var(--hl)}.badge.bad::before{background:#FF8F7A}
main{max-width:900px;margin:0 auto;padding:0 14px 14px}

/* navigazione */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 2px 8px;font:500 11px/1.1 var(--sans);color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--hl)}
nav.tabs button.on svg{stroke:var(--board)}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) nav.tabs button.on svg{stroke:var(--hl)}}:root[data-theme=dark] nav.tabs button.on svg{stroke:var(--hl)}

/* fascia in alto (data + riepilogo) */
.hero-date{flex:1;text-align:center;line-height:1.1;position:relative;cursor:pointer;display:block;min-width:0}
.hero-date .wd{font:500 14px var(--sans);color:var(--chalk2);text-transform:capitalize}
.hero-date .dm{font:700 21px var(--serif)}
.hero-date input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.ic{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--board2);color:var(--chalk);font-size:24px;line-height:1;cursor:pointer}
header.top .badge{margin-left:4px}
.band .link{background:none;border:0;color:var(--hl);font:600 13px var(--sans);cursor:pointer;text-decoration:underline;padding:4px}
.hero-row{display:flex;gap:8px;align-items:center;margin-top:2px;flex-wrap:wrap}
.tab-title{font:700 19px var(--serif);margin:0;flex:1}
.stat{background:var(--board2);border-radius:12px;padding:6px 11px;font-size:13px;color:var(--chalk2);white-space:nowrap}
.stat b{font:700 17px var(--serif);color:var(--chalk)}
.stat.bad{background:#9B2C18}.stat.bad b,.stat.bad{color:#fff}
.hero-row .b.hl{margin-left:auto;width:auto;min-height:40px;padding:6px 14px}
.absent-line{font-size:12.5px;color:var(--chalk2);margin:6px 0 0}.absent-line b{color:var(--chalk);font-weight:600}
.chip small{display:block}

/* linea del tempo */
.hour{display:flex;gap:12px;padding:0 0 4px}
.ruler{width:58px;flex:none;text-align:center;padding-top:10px;position:relative}
.ruler b{display:block;font:700 22px/1 var(--serif)}.ruler small{display:block;color:var(--mut);font-size:11px;margin-top:3px;line-height:1.2}
.ruler::after{content:"";position:absolute;right:-7px;top:16px;bottom:-10px;width:2px;background:var(--line)}
.hour:last-of-type .ruler::after{bottom:0}
.slots{flex:1;min-width:0}
.slot{display:grid;grid-template-columns:46px 1fr;gap:6px 11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin:0 0 8px}
.slot.open{border-color:var(--bad);background:var(--badbg)}
.cls{flex:none;min-width:46px;height:46px;border-radius:11px;background:var(--pen-bg);color:var(--pen);font:700 18px/1 var(--serif);display:flex;align-items:center;justify-content:center;padding:0 6px;text-align:center}
.cls.sm{font-size:12px;line-height:1.1}.cls.na{background:var(--soft);color:var(--mut)}
.slot.open .cls{background:var(--bad);color:#fff}
.who{flex:1;min-width:0}.who .l1{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.who .l2{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.act{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.chk{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--ok)}

/* sezioni e form */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.card h2{margin:0 0 10px;font:700 20px/1.2 var(--serif)}.card h3{margin:0 0 10px;font:700 17px/1.2 var(--serif)}
.page-title{font:700 26px/1.1 var(--serif);margin:18px 2px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:14px}.grow{flex:1}
button.b,a.b,label.b{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 16px;font:600 15px/1.1 var(--sans);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px}
button.b.pri,label.b.pri{background:var(--pen);color:#fff;border-color:var(--pen)}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) button.b.pri,:root:not([data-theme=light]) label.b.pri{color:#0B1630}}:root[data-theme=dark] button.b.pri,:root[data-theme=dark] label.b.pri{color:#0B1630}
button.b.hl{background:var(--hl);color:var(--hl-ink);border-color:var(--hl);font-weight:700}
button.b.sm{padding:7px 12px;font-size:13px;min-height:36px;border-radius:10px}button.b.bad{color:var(--bad)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:10px 11px;max-width:100%;min-height:44px}
input[type=checkbox]{min-height:0;width:20px;height:20px}
label.f{display:block;margin:12px 0 4px;font-size:14px;font-weight:600}label.f+input,label.f+select,label.f+textarea{width:100%}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1.5px solid var(--line);border-radius:12px;min-width:46px;padding:10px 14px;cursor:pointer;user-select:none;font-weight:600;text-align:center;background:var(--surface)}.chip.on{background:var(--board);color:var(--chalk);border-color:var(--board)}
.sub{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.sub:first-of-type{border-top:0}
.sub .h{min-width:62px;font:700 17px/1.1 var(--serif)}.sub .h small{display:block;font:400 11px var(--sans);color:var(--mut);margin-top:2px}
.sub .m{flex:1;min-width:0}.sub .m b{font-weight:700}
.tag{font:600 11px/1 var(--sans);padding:4px 8px;border-radius:99px;background:color-mix(in srgb,currentColor 12%,transparent);white-space:nowrap}
.tag.t1{color:var(--t1)}.tag.t2{color:var(--t2)}.tag.t3{color:var(--t3)}.tag.t4{color:var(--t4)}.tag.t0{color:var(--t0)}
.uncov{background:var(--bad);color:#fff;border-radius:99px;padding:4px 10px;font:700 12px/1 var(--sans)}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:11px 13px;font-size:14px;margin:10px 0}
.note.bad{background:var(--badbg);color:var(--bad)}
.ok-note{background:var(--okbg);color:var(--ok);border-radius:12px;padding:11px 13px;font-size:14px;margin:10px 0}
.empty{text-align:center;padding:26px 14px;color:var(--mut)}.empty b{display:block;color:var(--ink);font:700 18px var(--serif);margin-bottom:4px}
table.t{width:100%;border-collapse:collapse;font-size:15px;font-family:var(--sans)}table.t th,table.t td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}table.t th{font-weight:700;background:var(--soft);white-space:nowrap}
.scroll{overflow-x:auto;margin:0 -4px}
dialog{border:0;border-radius:20px;max-width:min(560px,94vw);width:100%;background:var(--surface);color:var(--ink);padding:20px;box-shadow:0 20px 60px #0A1530aa}
dialog[open]{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
dialog::backdrop{background:#0A1530b3}
.grid{display:grid;grid-template-columns:44px repeat(5,1fr);gap:5px;font-size:13px;text-align:center}.grid .c{padding:10px 2px;border:1.5px solid var(--line);border-radius:9px;cursor:pointer;min-height:42px}.grid .c.on{background:var(--board);color:var(--chalk);border-color:var(--board)}.grid .c.occ{opacity:.45;cursor:not-allowed;font-size:11px;background:var(--soft)}
details.card>summary{cursor:pointer;font:700 17px var(--serif)}
code{background:var(--soft);padding:2px 5px;border-radius:5px;font-size:13px;overflow-wrap:anywhere}

.chip b{display:block;font-size:1.05em}.chip small{display:block;font-size:.72em;font-weight:500;opacity:.85;margin-top:1px;white-space:nowrap}
.note .link{background:none;border:0;color:inherit;font:700 14px var(--sans);text-decoration:underline;cursor:pointer;padding:2px}.b:disabled{opacity:.4;cursor:default}

.opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.grp{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--t0);margin:10px 0 0}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:46px;padding:8px 12px;border:1.5px solid var(--line);border-left-width:5px;border-radius:12px;background:var(--surface);color:inherit;font:inherit;cursor:pointer}
.opt b{display:block;font-weight:700}.opt small{display:block;font-size:12.5px;opacity:.8;line-height:1.3}
.opt .mk{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.opt.g1{border-left-color:var(--t1)}.opt.g2{border-left-color:var(--t2)}.opt.g3{border-left-color:var(--t3)}.opt.g4{border-left-color:var(--t4)}.opt.none{border-left-color:var(--t0)}
.opt.sel{background:var(--board);color:var(--chalk);border-color:var(--board)}.opt.sel .mk{background:var(--hl);border-color:var(--hl)}
.mchips{display:flex;flex-wrap:wrap;gap:6px}.mc{min-height:40px;padding:6px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:inherit;font:inherit;font-weight:600;cursor:pointer}
.mc.sel{background:var(--board);color:var(--chalk);border-color:var(--board)}
.ev{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}.ev:first-of-type{border-top:0}.evt{flex:none;min-width:78px;font-weight:700;color:var(--pen);font-size:14px}.ev small{display:block;font-size:12.5px;opacity:.8;white-space:pre-line}
.pend{color:var(--warn);font-weight:700}.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
details.subs{margin:0 0 10px;padding-left:4px}details.subs summary{cursor:pointer;font-size:13.5px;color:var(--pen);font-weight:600;padding:6px 0}

/* ore da recuperare: pulsanti grandi */
.rec{padding:12px 0;border-top:1px solid var(--line)}.rec:first-of-type{border-top:0}
.recbtns{display:flex;gap:10px;margin-top:10px}.recbtns .b{flex:1;min-height:52px;font-size:20px;font-weight:700;padding:8px 10px}.recbtns .b.bad{flex:0 0 64px}
/* schermi larghi (tablet in orizzontale, computer): barra laterale */
@media (min-width:900px){
 nav.tabs{top:0;bottom:0;right:auto;width:96px;flex-direction:column;justify-content:flex-start;padding-top:14px;border-top:0;border-right:1px solid var(--line)}
 nav.tabs button{flex:none;padding:14px 4px;font-size:12px}
 nav.tabs button.on::before{left:0;right:auto;top:20%;bottom:20%;width:4px;height:auto;border-radius:0 4px 4px 0}
 body{padding:0 0 28px 96px}
 header.top,.band{margin-left:0}
}
@media (max-width:560px){.badge .bt{display:none}.badge{padding:0;width:34px;height:34px;justify-content:center;flex:none}.badge::before{width:12px;height:12px}.hero-date .dm{font-size:20px}}


.mp{margin:8px 0 0}.chip.sm{min-width:0;padding:6px 10px;font-size:.88em}.b.sm{padding:4px 10px;min-height:32px}

.dayh{margin:14px 0 6px;padding:7px 10px;border-radius:10px;background:var(--soft);font-weight:700;text-transform:capitalize}
.rr{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.rh{min-width:44px;text-align:center}.rh b{display:block;font-size:1.15em}.rh small{display:block;font-weight:700}
.rm{flex:1;min-width:0;line-height:1.5}
.rg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;font-size:.78em;font-weight:600;cursor:pointer;min-width:74px;text-align:center}
.rg.on{border-color:#2e8b57;background:rgba(46,139,87,.16)}
.rg input{width:26px;height:26px}
.rm .tag{font-size:13px;padding:5px 9px}
.uncov{background:var(--badbg);color:var(--bad);border:1.5px solid var(--bad);white-space:nowrap;display:inline-block;font-size:13px}
.rm .uncov{background:none;border:0;padding:0;border-radius:0;font-size:14px;font-weight:700;color:var(--bad);white-space:normal}.rm .uncov::before{content:"● ";font-size:.8em}
.recbtns .b.sm{flex:0 0 auto;min-height:34px;font-size:14px;padding:5px 12px}.recbtns{margin-top:6px}

/* --- fascia alta: scuola e ora --- */
header.top{flex-wrap:wrap}
header.top .school{flex:0 0 100%;text-align:center;font:500 11px/1.2 var(--sans);color:var(--chalk2);padding:2px 0 1px;letter-spacing:.01em}
.hero-date .clk{font-weight:600}

/* --- elenco ore di Oggi più compatto --- */
.hour{gap:8px;padding:0 0 2px}
.ruler{width:48px;padding-top:8px}.ruler b{font-size:18px}.ruler small{font-size:10px;margin-top:2px}
.slot{grid-template-columns:36px 1fr;gap:4px 9px;padding:7px 9px;margin:0 0 6px;border-radius:12px}
.cls{min-width:36px;height:36px;font-size:14px;border-radius:9px}
.who .l1{font-size:14px}.who .l2{font-size:12px}
.slot .tag{font-size:10px;padding:3px 7px}
.act{padding-top:5px;margin-top:0}
.act .b.sm{min-height:30px;padding:4px 10px;font-size:12px}
.chk{font-size:11px}.chk input{width:17px;height:17px}

/* --- tabella unica ore da recuperare --- */
.rt{display:block}
.rt-head,.rt-row{display:grid;grid-template-columns:1.4fr 1fr .9fr .8fr 1.3fr 128px;gap:8px;align-items:center}
.rt-head{font-weight:700;font-size:13px;background:var(--soft);border-radius:10px;padding:8px 10px;color:var(--mut)}
.rt-row{padding:9px 10px;border-bottom:1px solid var(--line)}
.rt-row input{width:64px;min-height:36px;padding:4px 8px}
.rt-row .ac{display:flex;gap:6px}.rt-row small{color:var(--mut)}
@media (max-width:700px){
  .rt-head{display:none}
  .rt-row{grid-template-columns:repeat(4,1fr);gap:6px 8px}
  .rt-row .nm{grid-column:1/-1;font-size:1.05em}
  .rt-row .c[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--mut);font-weight:600}
  .rt-row .c[data-l="Scadenza"]{grid-column:1/-1}
  .rt-row .ac{grid-column:1/-1}
}

/* --- intestazione: scuola in alto al centro, data e ora sotto --- */
.brand{background:var(--board);color:var(--chalk);text-align:center;padding:calc(12px + env(safe-area-inset-top)) max(14px,calc((100% - 900px)/2 + 14px)) 4px}
.brand .b1{font:700 19px/1.15 var(--serif);letter-spacing:.01em}
.brand .b2{font:600 13px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--hl);margin-top:3px}
.brand::after{content:"";display:block;width:56px;height:2px;margin:9px auto 0;background:var(--hl);opacity:.55;border-radius:2px}
header.top{padding-top:6px}
header.top .school{display:none}
.hero-date{display:flex;flex-direction:column;align-items:center;gap:2px}
.hero-date .dm{font:700 20px/1.15 var(--serif)}
.hero-date .clk{font:600 13px/1.1 var(--sans);color:var(--chalk2);text-transform:none;min-height:14px}
@media (max-width:380px){.brand .b1{font-size:17px}.hero-date .dm{font-size:18px}}

/* --- report su schermo largo: schede in griglia, non una sotto l'altra --- */
.rgrid{display:block}
@media (min-width:700px){
  .rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px;margin-bottom:6px}
  .rgrid .rr{border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--surface)}
  .rgrid .rm{display:block;line-height:1.45}.rgrid .rm>div{flex:none}
  .rgrid .rg{flex-direction:column;min-width:74px;padding:8px 10px;font-size:.78em;gap:4px}
  .rgrid .rg input{width:26px;height:26px}
}
.nosub{color:var(--ok);font-weight:700}
.slot .nosub{font-size:14px}

/* intestazione: data davvero centrata, badge a destra */
header.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px}
header.top .dnav{display:flex;align-items:center;gap:4px;justify-self:center}
header.top .hero-date{flex:none;min-width:170px}
header.top .badge{justify-self:end;margin-left:0}
.brand .b2{letter-spacing:.08em}

<script>/* Motore di sostituzione - nessuna dipendenza dal DOM, testabile in Node */
const Engine = (() => {
  const DAYS = ["LUN","MAR","MER","GIO","VEN"];
  const TIER_LABEL = {
    1: "A disposizione / alternativa IRC",
    2: "Sostegno già in classe",
    3: "Recupero ore (prima scelta se in buca o in coda)",
    4: "Ore eccedenti (disponibilità)"
  };

  function dayCode(dateStr) {
    const g = new Date(dateStr + "T12:00:00").getDay(); // 0 dom
    return g >= 1 && g <= 5 ? DAYS[g - 1] : null;
  }
  /* giorno senza lezioni: fine settimana, fuori dall'anno scolastico o chiusura (festività, ponti, vacanze) */
  function closedNote(state, date) {
    if (!dayCode(date)) return "Fine settimana";
    const S = (state && state.settings) || {};
    if (S.anno && S.anno.inizio && date < S.anno.inizio) return "Le lezioni non sono ancora iniziate";
    if (S.anno && S.anno.fine && date > S.anno.fine) return "Lezioni terminate";
    const c = (S.chiusure || []).find(x => date >= x.dal && date <= (x.al || x.dal));
    return c ? (c.nota || "Scuola chiusa") : null;
  }
  function addDays(dateStr, n) {
    const d = new Date(dateStr + "T12:00:00"); d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function datesBetween(a, b) {
    const out = []; let d = a; b = b || a;
    for (let i = 0; i < 400 && d <= b; i++) { out.push(d); d = addDays(d, 1); }
    return out;
  }
  function classesOf(cell) {
    if (!cell) return null;
    if (/^[123][ABCD]$/.test(cell)) return [cell];
    const m = /^([123])([ABCD])([ABCD])$/.exec(cell); // 1BC, 2BC
    if (m) return [m[1] + m[2], m[1] + m[3]];
    return null;
  }
  const isRealTeacher = d => d.ruolo !== "assistente";

  function activeSub(state) { return (state.sostituzioni || []).filter(s => !s.del); }
  function activeAbs(state) { return (state.assenze || []).filter(a => !a.del); }

  // ore in cui un docente è assente in una data (considerando tutte le assenze)
  function absentSlots(state, date, ignoreAbsId) {
    const map = {}; // cognome -> Set(ore) | "ALL"
    for (const a of activeAbs(state)) {
      if (a.id === ignoreAbsId) continue;
      if (date < a.dal || date > (a.al || a.dal)) continue;
      if (a.ore === "tutto" || !a.ore) map[a.docente] = "ALL";
      else if (map[a.docente] !== "ALL") {
        map[a.docente] = map[a.docente] || new Set();
        a.ore.forEach(o => map[a.docente].add(o));
      }
    }
    return map;
  }
  function isAbsent(map, doc, ora) {
    const v = map[doc]; return v === "ALL" || (v && v.has(ora));
  }

  /* ore scoperte generate da un'assenza */
  function coverNeeds(state, assenza) {
    const doc = state.orario.docenti[assenza.docente];
    if (!doc) return [];
    const needs = [];
    for (const date of datesBetween(assenza.dal, assenza.al || assenza.dal)) {
      const dc = dayCode(date); if (!dc) continue;
      if (closedNote(state, date)) continue;
      for (let ora = 1; ora <= 7; ora++) {
        if (assenza.ore !== "tutto" && assenza.ore && !assenza.ore.includes(ora)) continue;
        const cell = doc.orario[dc + ora];
        if (!cell) continue;
        const classi = classesOf(cell);
        if (classi) {
          const info = (state.orario.classi[classi[0]] || {})[dc + ora];
          const tipo = doc.ruolo === "sostegno" || (doc.ruoloOra && doc.ruoloOra[dc + ora] === "sostegno") ? "sostegno" : "lezione";
          needs.push({ date, ora, classi, classe: classi.join("+"), materia: tipo === "sostegno" ? "SOSTEGNO" : (info ? info.materia : doc.materie[0]), tipo, auto: true });
        } else if (cell === "A") {
          needs.push({ date, ora, classi: [], classe: "—", materia: "ALTERNATIVA IRC", tipo: "alternativa", auto: true });
        }
        // DIS (a disposizione) e B (biblioteca): nessuna classe da coprire
      }
    }
    return needs;
  }

  function monthKey(date) { return date.slice(0, 7); }
  function countFor(subs, doc, date, scope) {
    return subs.filter(s => !s.del && s.sostituto === doc && (scope === "day" ? s.data === date : monthKey(s.data) === monthKey(date))).length;
  }
  function presentOn(d, dc) {
    return Object.keys(d.orario).some(k => k.startsWith(dc));
  }

  /* dove cade un'ora libera rispetto alle lezioni del docente: anticipo / buca / coda */
  function posizione(d, dc, ora) {
    const hrs = Object.keys(d.orario).filter(k => k.startsWith(dc)).map(k => +k.slice(3));
    if (!hrs.length) return null;
    const first = Math.min(...hrs), last = Math.max(...hrs);
    return ora < first ? "anticipo" : ora > last ? "coda" : "buca";
  }
  /* ordine: già in classe (sostegno/compresenza), recupero senza anticipo, a disposizione/IRC, recupero in anticipo (da concordare), eccedenti */
  const rankOf = (tier, anticipo) => tier === 2 ? 0 : tier === 3 ? (anticipo ? 3 : 1) : tier === 1 ? 2 : 4;

  /* elenco ordinato dei candidati per una singola ora scoperta */
  function candidates(state, need, ctx) {
    const dc = dayCode(need.date), slot = dc + need.ora;
    const S = state.settings || {};
    const maxDay = S.maxPerGiorno || 3, maxDaySost = S.maxSostegnoGiorno || 1;
    const out = [];
    const subs = ctx.subs;
    const rec = Object.fromEntries((state.recuperi || []).filter(r => !r.del).map(r => [r.id, r]));
    const disp = Object.fromEntries((state.disp || []).filter(r => !r.del).map(r => [r.id, r]));
    const usedRec = {};
    for (const s of subs) if (!s.del && s.tier === 3) usedRec[s.sostituto] = (usedRec[s.sostituto] || 0) + 1;

    for (const [name, d] of Object.entries(state.orario.docenti)) {
      if (!isRealTeacher(d)) continue;
      if (name === need.docenteAssente) continue;
      if (isAbsent(ctx.absMap, name, need.ora)) continue;
      // già impegnato in una sostituzione in quella stessa ora
      if (subs.some(s => !s.del && s.sostituto === name && s.data === need.date && s.ora === need.ora)) continue;
      const nDay = countFor(subs, name, need.date, "day");
      const nMonth = countFor(subs, name, need.date, "month");
      const cell = d.orario[slot];
      let tier = null, motivo = "", extra = "", anticipo = false;
      // 1) a disposizione / alternativa
      if (cell === "DIS" || cell === "A") {
        if (d.ruolo === "sostegno" && cell === "A") { /* sostegno in alternativa: ammesso */ }
        tier = 1; motivo = cell === "DIS" ? "a disposizione" : "alternativa alla religione";
        if (nDay >= maxDay) continue;
      }
      // 2) già presente in classe in quell'ora: sostegno o compresenza
      else {
        const cl = classesOf(cell);
        if (cl && d.ruolo !== "strumento" && need.classi.some(c => cl.includes(c)) && need.tipo !== "alternativa") {
          const isSost = d.ruolo === "sostegno" || (d.ruoloOra && d.ruoloOra[slot] === "sostegno");
          if (!(need.tipo === "sostegno" && !isSost)) {
            if (nDay >= (isSost ? maxDaySost : maxDay)) continue;
            tier = 2; motivo = (isSost ? "sostegno già in classe " : "in compresenza in classe ") + cl.join("+");
          }
        }
      }
      // 3) recupero / 4) ore eccedenti: solo se libero in quell'ora
      if (tier === null && !cell) {
        const r = rec[name];
        if (r && (r.ore || 0) - (usedRec[name] || 0) > 0) {
          const pos = posizione(d, dc, need.ora);
          if (pos && nDay < maxDay) {
            const res = (r.ore || 0) - (usedRec[name] || 0);
            tier = 3; anticipo = pos === "anticipo";
            motivo = "deve recuperare " + res + " h · " + (pos === "buca" ? "ora buca" : pos === "coda" ? "in coda all'orario" : "in anticipo, da concordare con il docente");
            extra = String(-res);
          }
        }
      }
      if (tier === null && !cell) {
        const a = disp[name];
        if (a) {
          const slots = a.slot || [];
          const ok = slots.length ? slots.includes(slot) : presentOn(d, dc);
          if (ok && nDay < maxDay) {
            tier = 4; motivo = "disponibile ore eccedenti" + (a.dv ? " (⚠ orari da verificare)" : "");
          }
        }
      }
      if (tier === null) continue;
      // criteri di ordinamento a parità di fascia
      const stessaMateria = (d.materie || []).some(m => m === need.materia) ? 0 : 1;
      const stessaClasse = Object.values(d.orario).some(c => (classesOf(c) || []).some(x => need.classi.includes(x))) ? 0 : 1;
      out.push({ docente: name, tier, anticipo, motivo, nDay, nMonth, ordine: [rankOf(tier, anticipo), nMonth, nDay, stessaClasse, stessaMateria, name] });
    }
    out.sort((a, b) => {
      for (let i = 0; i < a.ordine.length; i++) {
        if (a.ordine[i] < b.ordine[i]) return -1;
        if (a.ordine[i] > b.ordine[i]) return 1;
      }
      return 0;
    });
    return out;
  }

  /* scelta manuale: docenti che quel giorno hanno lezione ma in quell'ora non sono impegnati in altre classi */
  function manualCandidates(state, need, ctx, excludeNames) {
    const dc = dayCode(need.date), slot = dc + need.ora, out = [];
    for (const [name, d] of Object.entries(state.orario.docenti)) {
      if (!isRealTeacher(d) || name === need.docenteAssente || excludeNames.has(name)) continue;
      if (isAbsent(ctx.absMap, name, need.ora)) continue;
      if (ctx.subs.some(s => !s.del && s.sostituto === name && s.data === need.date && s.ora === need.ora)) continue;
      if (!presentOn(d, dc)) continue;
      const cell = d.orario[slot];
      if (cell && cell !== "DIS" && cell !== "A") continue; // impegnato in una classe (o in biblioteca)
      out.push({ docente: name, motivo: cell === "DIS" ? "a disposizione (oltre il limite giornaliero)" : cell === "A" ? "alternativa (oltre il limite giornaliero)" : "libero in quest'ora", nMonth: countFor(ctx.subs, name, need.date, "month") });
    }
    return out.sort((a, b) => a.nMonth - b.nMonth || a.docente.localeCompare(b.docente));
  }

  /* proposta automatica per un'assenza */
  function propose(state, assenza, opts) {
    let needs = coverNeeds(state, assenza);
    if (opts && opts.senzaSostegno) needs = needs.filter(n => n.tipo !== "sostegno");
    needs.sort((a, b) => a.date.localeCompare(b.date) || a.ora - b.ora);
    // sostituzioni già esistenti (altre assenze) + quelle che sto assegnando ora
    const base = activeSub(state).filter(s => s.assenzaId !== assenza.id);
    const mine = [];
    const rows = [];
    for (const n of needs) {
      n.docenteAssente = assenza.docente;
      const ctx = { subs: base.concat(mine), absMap: absentSlots(state, n.date, null) };
      // l'assenza che sto calcolando conta come assenza già per le ore indicate
      const cands = n.auto ? candidates(state, n, ctx) : [];
      const best = cands[0] || null;
      const row = { data: n.date, ora: n.ora, classe: n.classe, classi: n.classi, materia: n.materia, tipo: n.tipo,
        assente: assenza.docente, sostituto: best ? best.docente : null, tier: best ? best.tier : null, anticipo: best ? !!best.anticipo : false,
        motivo: best ? best.motivo : "", auto: n.auto, alternative: cands };
      if (best) mine.push({ sostituto: best.docente, data: n.date, ora: n.ora, tier: best.tier });
      rows.push(row);
    }
    return rows;
  }

  return { DAYS, TIER_LABEL, dayCode, addDays, datesBetween, classesOf, coverNeeds, candidates, propose, closedNote, posizione, manualCandidates, absentSlots, countFor, activeSub, activeAbs, monthKey };
})();
if (typeof module !== "undefined") module.exports = Engine;
</script>
<script>/* Sostituzioni docenti - app personale (PWA). Dati: localStorage + file JSON in OneDrive. */
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const todayStr = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nice = n => String(n || "").toLowerCase().replace(/(^|[\s'])([a-zà-ý])/g, (m, p, c) => p + c.toUpperCase()).replace(/\bIrc\b/g, "IRC");
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" });
const fmtDateLong = d => new Date(d + "T12:00:00").toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const fmtShort = d => new Date(d + "T12:00:00").toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" });
const DAYN = { LUN: "Lunedì", MAR: "Martedì", MER: "Mercoledì", GIO: "Giovedì", VEN: "Venerdì" };
const MOTIVI = ["Malattia", "Permesso", "Permesso breve", "Formazione", "Uscita didattica", "Altro"];
const TIERNAME = { 0: "Manuale", 1: "A disposizione / IRC", 2: "Sostegno in classe", 3: "Recupero", 4: "Ore eccedenti" };

/* ============ stato ============ */
const KEY = "sost_state_v1", CFGKEY = "sost_cfg_v1", TOKKEY = "sost_tok_v1";
const COLL = ["assenze", "sostituzioni", "recuperi", "disp", "eventi", "permessi"];
const defaultSettings = () => ({
  id: "settings", upd: 0, maxPerGiorno: 3, maxSostegnoGiorno: 1, preavviso: 15,
  ore: [["08:00", "08:55"], ["08:55", "09:50"], ["10:05", "11:00"], ["11:00", "11:55"], ["12:05", "13:00"], ["13:00", "14:00"], ["14:20", "15:20"]]
});
function emptyState() { const s = { v: 1, orario: null, settings: defaultSettings() }; COLL.forEach(c => s[c] = []); return s; }
let state = (() => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) { COLL.forEach(c => s[c] = s[c] || []); s.settings = Object.assign(defaultSettings(), s.settings); return s; } } catch (e) { } return emptyState(); })();
let cfg = (() => { try { return JSON.parse(localStorage.getItem(CFGKEY)) || {}; } catch (e) { return {}; } })();
const ui = { tab: "oggi", date: todayStr(), draft: null, regMode: "settimana", regDate: todayStr(), sync: { st: "off", msg: "" } };

function touch(r) { r.upd = Date.now(); return r; }
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast("Spazio del browser pieno: esportare un backup"); } }
function commit() { saveLocal(); scheduleSync(); render(); }
function put(coll, rec) { rec.id = rec.id || uid(); touch(rec); const i = state[coll].findIndex(r => r.id === rec.id); if (i >= 0) state[coll][i] = rec; else state[coll].push(rec); return rec; }
function del(coll, id) { const r = state[coll].find(x => x.id === id); if (r) { r.del = true; touch(r); } }

/* merge per record (vince l'ultimo aggiornamento) */
function mergeColl(a = [], b = []) { const m = new Map(); for (const r of [...a, ...b]) { const o = m.get(r.id); if (!o || (r.upd || 0) > (o.upd || 0)) m.set(r.id, r); } const lim = Date.now() - 60 * 864e5; return [...m.values()].filter(r => !(r.del && (r.upd || 0) < lim)); }
function newest(a, b) { if (!a) return b; if (!b) return a; return (b.upd || 0) > (a.upd || 0) ? b : a; }
function mergeState(l, r) { const o = { v: 1, orario: newest(l.orario, r.orario), settings: newest(l.settings, r.settings) || defaultSettings() }; COLL.forEach(c => o[c] = mergeColl(l[c], r[c])); o.settings = Object.assign(defaultSettings(), o.settings); return o; }

/* ============ utilità dominio ============ */
const E = Engine;
const teachers = () => state.orario ? Object.entries(state.orario.docenti).filter(([, d]) => d.ruolo !== "assistente").map(([k, d]) => ({ k, ...d })).sort((a, b) => a.k.localeCompare(b.k)) : [];
const oraLabel = n => { const o = state.settings.ore[n - 1]; return o ? `${o[0]}–${o[1]}` : ""; };
const subs = () => E.activeSub(state);
function tierTag(t, extra, ant) { return `<span class="tag t${t || 0}">${esc(TIERNAME[t || 0])}${ant ? " in anticipo · da concordare" : ""}${extra ? " · " + esc(extra) : ""}</span>`; }
function usedRecuperi(name) { return subs().filter(s => s.sostituto === name && s.tier === 3).length; }
function toast(m) { let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.style.cssText = "position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 16px;border-radius:99px;z-index:20;font-size:14px;max-width:90vw"; document.body.appendChild(t); } t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3200); }
function needFor(s) { return { date: s.data, ora: s.ora, classi: s.classi || [], materia: s.materia, tipo: s.tipo, docenteAssente: s.assente }; }

/* elenco visibile dei sostituti, a gruppi nell'ordine di priorità; l'ultimo gruppo è la scelta manuale */
const GRUPPI = [["in classe", "Già in classe (sostegno e compresenza)", c => c.tier === 2], ["rec", "Devono recuperare un'ora", c => c.tier === 3 && !c.anticipo], ["disp", "A disposizione / alternativa", c => c.tier === 1], ["ant", "Recupero in anticipo · da concordare con il docente", c => c.tier === 3 && c.anticipo], ["ecc", "Ore eccedenti", c => c.tier === 4]];
function optList(need, currentSubs, selected, act, idx) {
  const ctx = { subs: currentSubs, absMap: E.absentSlots(state, need.date, null) };
  const c = need.tipo === "altro" ? [] : E.candidates(state, need, ctx);
  const man = E.manualCandidates(state, need, ctx, new Set(c.map(x => x.docente)));
  const attr = v => `data-act="${act}" ${idx !== undefined ? `data-i="${idx}"` : ""} data-v="${esc(v)}"`;
  const shown = new Set(); let h = `<div class="opts" role="radiogroup">`;
  GRUPPI.forEach(([k, label, f], gi) => {
    const L = c.filter(f); if (!L.length) return;
    h += `<div class="grp">${esc(label)}</div>` + L.map(x => { shown.add(x.docente); return `<button type="button" class="opt g${k === "in classe" ? 2 : k === "rec" || k === "ant" ? 3 : k === "disp" ? 1 : 4} ${selected === x.docente ? "sel" : ""}" ${attr(x.docente + "|" + x.tier + "|" + (x.anticipo ? 1 : 0))}><span class="mk"></span><span><b>${esc(nice(x.docente))}</b><small>${esc(x.motivo)}</small></span></button>`; }).join("");
  });
  if (selected && !c.some(x => x.docente === selected) && !man.some(x => x.docente === selected))
    h += `<div class="grp">Scelta attuale</div><button type="button" class="opt sel" ${attr(selected + "|0|0")}><span class="mk"></span><span><b>${esc(nice(selected))}</b></span></button>`;
  if (man.length) h += `<div class="grp">Scelta manuale · hanno lezione quel giorno e in quest'ora sono liberi</div><div class="mchips">` + man.map(x => `<button type="button" class="mc ${selected === x.docente ? "sel" : ""}" title="${esc(x.motivo)}" ${attr(x.docente + "|0|0")}>${esc(nice(x.docente))}</button>`).join("") + `</div>`;
  return h + `<button type="button" class="opt none ${!selected ? "sel" : ""}" style="margin-top:10px" ${attr("")}><span class="mk"></span><span><b>Nessuno</b><small>l'ora resta scoperta</small></span></button></div>`;
}

/* ============ rendering ============ */
const BUILD = "24/10/2026 · 4";

const TITOLI_CAL = ["ATTIVITA' DIDATTICHE", "PIANO ATTIVITA' DOCENTI"];
/* ---- CALENDARIO DELLA SCUOLA (sola lettura, tramite uno script Google dell'utente) ---- */
const CALKEY = "sost_cal_v1";
let calCache = (() => { try { return JSON.parse(localStorage.getItem(CALKEY)) || {}; } catch (e) { return {}; } })();
const calCfg = () => { const c = state.settings.cal; return c && c.url ? c : null; };
const calFail = {};

  const to = E.addDays(date, 6);

    const r = await fetch(`${c.url}${c.url.includes("?") ? "&" : "?"}k=${encodeURIComponent(c.k || "")}&from=${date}&to=${to}`);
    const j = await r.json(); if (j.error) throw new Error(j.error);

    const lim = E.addDays(todayStr(), -60); Object.keys(calCache).forEach(k => { if (k < lim) delete calCache[k]; });
    try { localStorage.setItem(CALKEY, JSON.stringify(calCache)); } catch (e) { }
    delete calFail[date]; ui.calErr = "";
  } catch (e) { calFail[date] = Date.now(); ui.calErr = e.message || "errore"; }

}

/* ---- PERMESSI BREVI: ore da recuperare entro 2 mesi ---- */
const addMonths = (d, n) => { const x = new Date(d + "T12:00:00"), g = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n); x.setDate(Math.min(g, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return x.toISOString().slice(0, 10); };

/* regola: al massimo metà delle ore del giorno (alternativa esclusa); le ore entro il limite vanno recuperate */
function permessoCalc(f) {
  const out = []; if (f.motivo !== "Permesso breve" || !state.orario) return out;
  const doc = state.orario.docenti[f.docente]; if (!doc) return out;
  for (const date of E.datesBetween(f.dal, f.al && f.al >= f.dal ? f.al : f.dal)) {
    const dc = E.dayCode(date); if (!dc || closedOn(date)) continue;
    const mine = []; for (let o = 1; o <= 7; o++) { const c = doc.orario[dc + o]; if (c && c !== "A") mine.push(o); }
    const sel = f.tutto ? mine : mine.filter(o => f.ore.includes(o));
    if (!sel.length) continue;
    const max = Math.floor(mine.length / 2), rec = Math.min(sel.length, max);

  }
  return out;
}
function permessiStato() {
  const items = (state.permessi || []).filter(p => !p.del).sort((a, b) => a.data.localeCompare(b.data)).map(p => ({ p, scad: addMonths(p.data, 2), res: Math.max(0, p.ore - (p.fatteMan || 0)), auto: 0, man: p.fatteMan || 0 }));
  const sb = subs().filter(x => x.tier === 3 && x.sostituto).sort((a, b) => a.data.localeCompare(b.data));
  for (const x of sb) { const it = items.find(i => i.p.docente === x.sostituto && i.res > 0 && i.p.data <= x.data && x.data <= i.scad); if (it) { it.res--; it.auto++; } }

}
function pendAlert() {
  const by = {}; subs().filter(s => s.pending && !s.sostituto && s.auto !== false).forEach(s => (by[s.assenzaId] = by[s.assenzaId] || []).push(s));
  const as = Object.keys(by).map(id => state.assenze.find(x => x.id === id && !x.del)).filter(Boolean).sort((a, b) => a.dal.localeCompare(b.dal));

}
function recAlert() {
  const open = permessiStato().filter(i => i.res > 0), late = open.filter(i => i.days < 0), soon = open.filter(i => i.days >= 0 && i.days <= 30);
  if (!late.length && !soon.length) return "";

  const msg = (late.length ? `<b>${h} ${h === 1 ? "ora" : "ore"} da recuperare scadute</b>` : "") + (late.length && soon.length ? " · " : "") + (soon.length ? `<b>${hs} ${hs === 1 ? "ora" : "ore"} in scadenza</b> (entro 30 giorni)` : "");

function recItems() { const items = permessiStato(); return { open: items.filter(i => i.res > 0).sort((a, b) => a.scad.localeCompare(b.scad)), done: items.filter(i => i.res === 0).reverse() }; }
const recWhen = i => i.days < 0 ? `<span class="uncov">scaduto da ${-i.days} ${-i.days === 1 ? "giorno" : "giorni"}</span>` : i.days === 0 ? '<span class="uncov">scade oggi</span>' : i.days <= 30 ? `<span style="color:var(--warn);font-weight:700">scade tra ${i.days} ${i.days === 1 ? "giorno" : "giorni"}</span>` : `scade tra ${i.days} giorni`;

/* Assenze: un'unica tabella «Ore da recuperare», una riga per docente */

  if (Date.now() < t.exp) return t.access;

  catch (e) { if (e instanceof TypeError) throw e; localStorage.removeItem(TOKKEY); ui.sync = { st: "login", msg: "sessione scaduta: accedere di nuovo" }; renderSyncBadge(); return null; }
}
let syncTimer = null, syncing = false;
function scheduleSync() { if (!getTok()) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(false), 1500); }
async function sync(manual) {
  if (syncing) return; if (!cfg.clientId || !getTok()) { if (manual) toast("Accedere prima a Microsoft"); return; }
  syncing = true; ui.sync = { st: "busy", msg: "sincronizzazione in corso" }; renderSyncBadge();
  try {
    const tok = await accessToken(); if (!tok) { syncing = false; return; }
    const H = { Authorization: "Bearer " + tok };
    for (let i = 0; i < 4; i++) {
      let etag = null, remote = null;
      const m = await fetch(GRAPH + fileRef(), { headers: H });
      if (m.ok) { etag = (await m.json()).eTag; const c = await fetch(GRAPH + fileRef() + ":/content", { headers: H }); if (c.ok) remote = await c.json(); }
      else if (m.status !== 404) throw new Error("OneDrive " + m.status);
      if (remote && remote.v === 1) state = mergeState(state, remote);
      saveLocal();
      const p = await fetch(GRAPH + fileRef() + ":/content", { method: "PUT", headers: { ...H, "Content-Type": "application/json", ...(etag ? { "If-Match": etag } : {}) }, body: JSON.stringify(state) });
      if (p.ok) { ui.sync = { st: "ok", msg: "ultimo salvataggio " + new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }) }; render(); if (manual) toast("Sincronizzato"); syncing = false; return; }
      if (p.status !== 412 && p.status !== 409) throw new Error("OneDrive " + p.status);
    }
    throw new Error("conflitto ripetuto: riprovare");
  } catch (e) { ui.sync = e instanceof TypeError ? { st: "offline", msg: "offline: i dati sono salvati sul dispositivo" } : { st: "err", msg: e.message }; renderSyncBadge(); }
  syncing = false;
}
window.addEventListener("online", () => scheduleSync());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") scheduleSync(); });

/* ============ avvio ============ */
(async function init() {
  await handleRedirect();
  render();
  if (getTok()) sync(false); else if (cfg.clientId && ui.sync.st === "off") { ui.sync = { st: "login", msg: "accedere a Microsoft per sincronizzare" }; renderSyncBadge(); }
  setInterval(checkNotifiche, 30000);
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => { });
})();
</script>
